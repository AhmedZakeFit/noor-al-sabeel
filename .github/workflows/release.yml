name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and install components
        run: |
          SDKMANAGER=""
          for cand in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager; do
            if [ -x "$cand" ]; then SDKMANAGER="$cand"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          else
            echo "sdkmanager not found; accepting licenses directly"
            mkdir -p "$ANDROID_HOME/licenses"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
              > "$ANDROID_HOME/licenses/android-sdk-license"
          fi

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            sha256sum "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK will be unsigned."
          fi

      - name: Run tests and build release APK
        env:
          NOOR_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Stage APK and checksum
        run: |
          mkdir -p release-out
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-out/noor-al-sabeel-$VERSION.apk"
            # Stable-named copy for the landing page's fixed direct link:
            # https://github.com/…/releases/latest/download/noor-al-sabeel.apk
            # always resolves to this asset of the newest release, so the
            # landing page never needs editing after a release. Identical
            # bytes (and sha256) as the versioned asset above.
            cp app/build/outputs/apk/release/app-release.apk "release-out/noor-al-sabeel.apk"
            SIGNED=1
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-out/noor-al-sabeel-$VERSION-unsigned.apk"
            SIGNED=0
          fi
          cd release-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: "Guard: never publish an unsigned update"
        if: env.SIGNED == '0'
        run: |
          echo "::error::The release APK is UNSIGNED (signing secrets missing). Publishing it would brick every in-app update with a signature mismatch. Refusing to publish." >&2
          exit 1

      # v1.0.17 root-cause guard: the v1.0.16 release was re-published with
      # DIFFERENT APK bytes ~19 minutes after its first publish (the workflow
      # was re-run for the same tag). softprops then deleted and re-uploaded
      # the assets one by one under live users, so in-flight in-app updates
      # verified the OLD checksum against the NEW APK (or vice versa) and
      # failed with a false "SHA-256 mismatch". Re-publishing a tag is
      # therefore forbidden: identical bytes are a no-op, different bytes
      # fail the build and force a NEW version tag instead.
      - name: "Guard: never swap bytes of an already-published release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh api "repos/${{ github.repository }}/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "No existing release for $TAG — publishing fresh."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          NEW_SHA="$(sha256sum "release-out/noor-al-sabeel-$VERSION.apk" | cut -d' ' -f1)"
          FOUND=0
          for ASSET in "noor-al-sabeel-$VERSION.apk.sha256" "noor-al-sabeel.apk.sha256"; do
            if gh release download "$TAG" --repo "${{ github.repository }}" \
                 --pattern "$ASSET" \
                 --output "existing-$ASSET" >/dev/null 2>&1 && [ -s "existing-$ASSET" ]; then
              PUBLISHED_SHA="$(awk '{print tolower($1)}' "existing-$ASSET")"
              FOUND=1
              if [ "$NEW_SHA" != "$PUBLISHED_SHA" ]; then
                echo "::error::Release $TAG is already published with DIFFERENT bytes ($ASSET: published $PUBLISHED_SHA vs this build $NEW_SHA). Never mutate a published release: in-flight in-app updates verify the old checksum against the new APK and fail with a false SHA-256 mismatch. Publish a NEW version tag instead." >&2
                exit 1
              fi
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "Release $TAG is already published with EXACTLY these bytes ($NEW_SHA) — skipping re-upload (no asset swap window)."
            echo "SKIP_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "Release $TAG exists but has no published checksum asset (partial publish?) — completing it now."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # v1.0.18: publish ATOMICALLY. The release is created as a DRAFT first,
      # its four assets are downloaded back and fully verified, and only then
      # is the release made public. Before the publish step, /releases/latest
      # and the API keep serving the previous release — a half-uploaded
      # release is never observable. This closes the SECOND window behind
      # the byte-swap guard above: GitHub lists an asset from the moment its
      # upload STARTS (state "starter", size 0), and the small .sha256 files
      # commit within ~0.1 s while the 24 MB APKs take minutes — eager
      # updaters who checked in that window (v1.0.16) downloaded a final
      # checksum against incomplete APK bytes and correctly saw "SHA-256
      # does not match the published checksum".
      # ─────────────────────────────────────────────────────────────────────
      - name: Create GitHub Release as a draft
        if: env.SKIP_UPLOAD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-out/*.apk
            release-out/*.sha256
          body: |
            ${{ env.SIGNED == '1' && format('**Noor Al-Sabeel (نور السبيل) v{0}** — signed release APK. See [CHANGELOG](https://github.com/AhmedZakeFit/noor-al-sabeel/blob/main/CHANGELOG.md) and [install steps](https://github.com/AhmedZakeFit/noor-al-sabeel#install).' , github.ref_name) || '**Unsigned build** — signing secrets were not configured; use the debug APK from CI or build it yourself (docs/BUILDING.md).' }}

      - name: Verify the draft release assets end-to-end before publishing
        if: env.SKIP_UPLOAD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          REPO_FILE="$GITHUB_WORKSPACE/app/src/main/res/raw"
          rm -rf verify-dl && mkdir verify-dl && cd verify-dl

          echo "::group::Download every published asset back"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'noor-al-sabeel.apk' \
            --pattern 'noor-al-sabeel.apk.sha256' \
            --pattern "noor-al-sabeel-$VERSION.apk" \
            --pattern "noor-al-sabeel-$VERSION.apk.sha256"
          ls -la
          echo "::endgroup::"

          echo "::group::All four assets are present with real sizes"
          for f in "noor-al-sabeel-$VERSION.apk" "noor-al-sabeel-$VERSION.apk.sha256" \
                   "noor-al-sabeel.apk" "noor-al-sabeel.apk.sha256"; do
            [ -s "$f" ] || { echo "::error::asset $f is missing or empty — the release is half-published"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::The two APK copies are identical and match the published checksums"
          sha256sum noor-al-sabeel.apk "noor-al-sabeel-$VERSION.apk"
          cmp noor-al-sabeel.apk "noor-al-sabeel-$VERSION.apk" \
            || { echo "::error::stable APK differs from the versioned APK"; exit 1; }
          ACTUAL="$(sha256sum noor-al-sabeel.apk | cut -d' ' -f1)"
          for sha_file in "noor-al-sabeel.apk.sha256" "noor-al-sabeel-$VERSION.apk.sha256"; do
            PUBLISHED="$(awk '{print tolower($1)}' "$sha_file")"
            [ "$PUBLISHED" = "$ACTUAL" ] \
              || { echo "::error::$sha_file publishes $PUBLISHED but the APK is $ACTUAL"; exit 1; }
          done
          echo "Checksum assets match the downloadable APK bytes: $ACTUAL"
          echo "::endgroup::"

          echo "::group::The APK is a valid, correctly signed archive"
          MAGIC="$(head -c 4 "noor-al-sabeel-$VERSION.apk" | od -An -tx1 | tr -d ' \n')"
          [ "$MAGIC" = "504b0304" ] || { echo "::error::not a ZIP/APK (magic $MAGIC)"; exit 1; }
          "$BT/apksigner" verify "noor-al-sabeel-$VERSION.apk" \
            || { echo "::error::apksigner rejected the release APK"; exit 1; }
          CERT="$( "$BT/apksigner" verify --print-certs "noor-al-sabeel-$VERSION.apk" \
                   | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: //' )"
          echo "Release signing certificate: $CERT"
          PREV_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            mkdir -p prev && gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'noor-al-sabeel.apk' --dir prev/ || true
            if [ -s prev/noor-al-sabeel.apk ]; then
              "$BT/apksigner" verify prev/noor-al-sabeel.apk || { echo "::error::previous release APK no longer verifies"; exit 1; }
              PREV_CERT="$( "$BT/apksigner" verify --print-certs prev/noor-al-sabeel.apk \
                            | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: //' )"
              [ "$CERT" = "$PREV_CERT" ] || {
                echo "::error::signing certificate changed between $PREV_TAG and $TAG ($PREV_CERT -> $CERT); published updates would be refused by Android"
                exit 1
              }
              echo "Signing certificate unchanged since $PREV_TAG — in-place updates stay installable."
            fi
          fi
          echo "::endgroup::"

          echo "::group::Package identity and version"
          BADGE="$( "$BT/aapt2" dump badging "noor-al-sabeel-$VERSION.apk" | head -1 )"
          echo "$BADGE"
          echo "$BADGE" | grep -q "name='io.github.ahmedzakefit.noor'" \
            || { echo "::error::package name changed: $BADGE"; exit 1; }
          echo "$BADGE" | grep -q "versionName='$VERSION'" \
            || { echo "::error::versionName mismatch: expected $VERSION in $BADGE"; exit 1; }
          echo "::endgroup::"

          echo "::group::The bundled Cairo (Egypt) adhan asset is the verified recording"
          # The v1.0.16 report: the 'Cairo' voice shipped the generic 2-takbeer
          # file for years. Pin the bytes embedded in the release APK against
          # the repository's verified Al-Husari recording. AAPT2 shortens
          # resource paths inside the APK (res/xx.mp3), so match by hash.
          # NOTE: hash to a FILE, then grep the file — piping sha256sum into
          # `grep -q` under `set -o pipefail` makes the early-exiting grep
          # SIGPIPE sha256sum and fail the step spuriously.
          mkdir -p apk-res && unzip -j -o "noor-al-sabeel-$VERSION.apk" 'res/*.mp3' -d apk-res/ > /dev/null
          sha256sum apk-res/*.mp3 > embedded-hashes.txt
          for expected in adhan_cairo.mp3 adhan_cairo_fajr.mp3; do
            WANT="$(sha256sum "$REPO_FILE/$expected" | cut -d' ' -f1)"
            if ! grep -q "$WANT" embedded-hashes.txt; then
              echo "::error::the APK does not embed the repository's verified $expected"
              exit 1
            fi
          done
          echo "Bundled Cairo adhan assets match the repository files (byte-identical)."
          echo "::endgroup::"

          echo "All pre-publish checks passed for $TAG."

      - name: Publish the verified release
        if: env.SKIP_UPLOAD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published ${GITHUB_REF_NAME} — /releases/latest now serves the fully verified release."

      - name: Nothing to re-publish (identical bytes) — confirm the live release is healthy
        if: env.SKIP_UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Release ${GITHUB_REF_NAME} already carries exactly these bytes; leaving the published assets untouched."

  verify-download-link:
    # Runs immediately after the release is published: downloads the APK
    # through the landing page's fixed direct link, verifies it (magic bytes,
    # size, SHA-256 against the versioned asset and the published checksum)
    # and only then refreshes the landing page's release.json. The `release`
    # event itself never fires for releases created with GITHUB_TOKEN, hence
    # this explicit call.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/verify-download.yml
    permissions:
      contents: write
