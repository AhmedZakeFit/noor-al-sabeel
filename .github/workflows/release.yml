name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and install components
        run: |
          SDKMANAGER=""
          for cand in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager; do
            if [ -x "$cand" ]; then SDKMANAGER="$cand"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          else
            echo "sdkmanager not found; accepting licenses directly"
            mkdir -p "$ANDROID_HOME/licenses"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
              > "$ANDROID_HOME/licenses/android-sdk-license"
          fi

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            sha256sum "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK will be unsigned."
          fi

      - name: Run tests and build release APK
        env:
          NOOR_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Stage APK and checksum
        run: |
          mkdir -p release-out
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-out/noor-al-sabeel-$VERSION.apk"
            # Stable-named copy for the landing page's fixed direct link:
            # https://github.com/…/releases/latest/download/noor-al-sabeel.apk
            # always resolves to this asset of the newest release, so the
            # landing page never needs editing after a release. Identical
            # bytes (and sha256) as the versioned asset above.
            cp app/build/outputs/apk/release/app-release.apk "release-out/noor-al-sabeel.apk"
            SIGNED=1
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-out/noor-al-sabeel-$VERSION-unsigned.apk"
            SIGNED=0
          fi
          cd release-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: "Guard: never publish an unsigned update"
        if: env.SIGNED == '0'
        run: |
          echo "::error::The release APK is UNSIGNED (signing secrets missing). Publishing it would brick every in-app update with a signature mismatch. Refusing to publish." >&2
          exit 1

      # v1.0.17 root-cause guard: the v1.0.16 release was re-published with
      # DIFFERENT APK bytes ~19 minutes after its first publish (the workflow
      # was re-run for the same tag). softprops then deleted and re-uploaded
      # the assets one by one under live users, so in-flight in-app updates
      # verified the OLD checksum against the NEW APK (or vice versa) and
      # failed with a false "SHA-256 mismatch". Re-publishing a tag is
      # therefore forbidden: identical bytes are a no-op, different bytes
      # fail the build and force a NEW version tag instead.
      - name: "Guard: never swap bytes of an already-published release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh api "repos/${{ github.repository }}/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "No existing release for $TAG — publishing fresh."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          NEW_SHA="$(sha256sum "release-out/noor-al-sabeel-$VERSION.apk" | cut -d' ' -f1)"
          FOUND=0
          for ASSET in "noor-al-sabeel-$VERSION.apk.sha256" "noor-al-sabeel.apk.sha256"; do
            if gh release download "$TAG" --repo "${{ github.repository }}" \
                 --pattern "$ASSET" \
                 --output "existing-$ASSET" >/dev/null 2>&1 && [ -s "existing-$ASSET" ]; then
              PUBLISHED_SHA="$(awk '{print tolower($1)}' "existing-$ASSET")"
              FOUND=1
              if [ "$NEW_SHA" != "$PUBLISHED_SHA" ]; then
                echo "::error::Release $TAG is already published with DIFFERENT bytes ($ASSET: published $PUBLISHED_SHA vs this build $NEW_SHA). Never mutate a published release: in-flight in-app updates verify the old checksum against the new APK and fail with a false SHA-256 mismatch. Publish a NEW version tag instead." >&2
                exit 1
              fi
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "Release $TAG is already published with EXACTLY these bytes ($NEW_SHA) — skipping re-upload (no asset swap window)."
            echo "SKIP_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "Release $TAG exists but has no published checksum asset (partial publish?) — completing it now."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: env.SKIP_UPLOAD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-out/*.apk
            release-out/*.sha256
          body: |
            ${{ env.SIGNED == '1' && format('**Noor Al-Sabeel (نور السبيل) v{0}** — signed release APK. See [CHANGELOG](https://github.com/AhmedZakeFit/noor-al-sabeel/blob/main/CHANGELOG.md) and [install steps](https://github.com/AhmedZakeFit/noor-al-sabeel#install).' , github.ref_name) || '**Unsigned build** — signing secrets were not configured; use the debug APK from CI or build it yourself (docs/BUILDING.md).' }}

  verify-download-link:
    # Runs immediately after the release is published: downloads the APK
    # through the landing page's fixed direct link, verifies it (magic bytes,
    # size, SHA-256 against the versioned asset and the published checksum)
    # and only then refreshes the landing page's release.json. The `release`
    # event itself never fires for releases created with GITHUB_TOKEN, hence
    # this explicit call.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/verify-download.yml
    permissions:
      contents: write
