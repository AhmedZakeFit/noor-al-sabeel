name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK will be unsigned."
          fi

      - name: Run tests and build release APK
        env:
          NOOR_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Stage APK and checksum
        run: |
          mkdir -p release-out
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-out/noor-$VERSION.apk"
            SIGNED=1
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-out/noor-$VERSION-unsigned.apk"
            SIGNED=0
          fi
          cd release-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-out/*.apk
            release-out/*.sha256
          body: |
            ${{ env.SIGNED == '1' && format('**NOOR v{0}** — signed release APK. See [CHANGELOG](https://github.com/AhmedZakeFit/noor/blob/main/CHANGELOG.md) and [install steps](https://github.com/AhmedZakeFit/noor#install).' , github.ref_name) || '**Unsigned build** — signing secrets were not configured; use the debug APK from CI or build it yourself (docs/BUILDING.md).' }}
