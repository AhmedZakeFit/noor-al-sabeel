name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        continue-on-error: true # checksum service can be transiently unreachable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and install components
        run: |
          SDKMANAGER=""
          for cand in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager; do
            if [ -x "$cand" ]; then SDKMANAGER="$cand"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          else
            echo "sdkmanager not found; accepting licenses directly"
            mkdir -p "$ANDROID_HOME/licenses"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
              > "$ANDROID_HOME/licenses/android-sdk-license"
          fi

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-sabeel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
