name: Test build (phone testing)

# Manual-only workflow that produces a SIGNED test APK from main for
# on-device testing BEFORE an official release:
#   - same signing key and Gradle config as official releases;
#   - versionCode untouched (installs as an in-place update over the
#     installed release; app data is preserved), versionName stamped
#     "<current>.1-test.<sha>" so the build is recognizable on the device
#     while the extra numeric segment keeps the in-app updater silent
#     (the official release never parses as "newer" than a test build);
#   - published as a PRE-RELEASE tagged "test-<sha>": pre-releases are
#     excluded from /releases/latest, so the landing page's fixed download
#     link and the in-app update check are completely unaffected;
#   - the tag does not match 'v*', so the official Release workflow never
#     fires, and the release is created with GITHUB_TOKEN, so no `release`
#     event is dispatched (verify-download.yml is not triggered);
#   - fails hard (nothing published) if signing secrets are missing or if
#     the signer certificate differs from the latest official release APK.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    name: Signed test APK (pre-release, not official)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and install components
        run: |
          SDKMANAGER=""
          for cand in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager; do
            if [ -x "$cand" ]; then SDKMANAGER="$cand"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          else
            echo "sdkmanager not found; accepting licenses directly"
            mkdir -p "$ANDROID_HOME/licenses"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
              > "$ANDROID_HOME/licenses/android-sdk-license"
          fi

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Stamp test version name (ephemeral, never committed)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          BASE_VERSION="$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts)"
          [ -n "$BASE_VERSION" ] || { echo "::error::could not read versionName from app/build.gradle.kts"; exit 1; }
          TEST_VERSION="${BASE_VERSION}.1-test.${SHORT_SHA}"
          sed -i -E "s/versionName = \"[0-9.]+\"/versionName = \"${TEST_VERSION}\"/" app/build.gradle.kts
          grep -q "versionName = \"${TEST_VERSION}\"" app/build.gradle.kts
          echo "TEST_VERSION=$TEST_VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Staging test build $TEST_VERSION (versionCode untouched — installs over the installed release)."

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a test APK must be signed with the release key to install over the installed app. Nothing built."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"

      - name: Run tests and build signed release APK
        env:
          NOOR_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Record APK facts (package, version, signer)
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::no signed app-release.apk produced — refusing to publish a test APK that could not update the installed app."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | head -n 1
          "$BT/apksigner" verify --print-certs "$APK" | tee test-certs.txt
          TEST_SIGNER="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2)}' test-certs.txt)"
          [ -n "$TEST_SIGNER" ] || { echo "::error::could not read the signer certificate"; exit 1; }
          echo "TEST_SIGNER=$TEST_SIGNER" >> "$GITHUB_ENV"

      - name: Compare signer with the latest official release APK
        run: |
          set -euo pipefail
          curl -sSL -o official.apk \
            "https://github.com/${{ github.repository }}/releases/latest/download/noor-al-sabeel.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OFFICIAL_SIGNER="$("$BT/apksigner" verify --print-certs official.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2)}')"
          [ -n "$OFFICIAL_SIGNER" ] || { echo "::error::could not read the official APK signer certificate"; exit 1; }
          if [ "$TEST_SIGNER" = "$OFFICIAL_SIGNER" ]; then
            echo "SIGNER MATCH: the test APK is signed with the same certificate as the latest official release, so it installs as an in-place update over it (data preserved)."
          else
            echo "::error::SIGNER MISMATCH — this test APK could NOT update the installed official app. Nothing published."
            exit 1
          fi

      - name: Stage APK and checksum
        run: |
          set -euo pipefail
          mkdir -p test-out
          cp app/build/outputs/apk/release/app-release.apk "test-out/noor-al-sabeel-${TEST_VERSION}.apk"
          cd test-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-test-apk-${{ env.SHORT_SHA }}
          path: test-out/*
          if-no-files-found: error

      - name: Publish clearly-marked PRE-RELEASE (not official)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## TEST BUILD — NOT an official release / نسخة اختبارية — ليست إصدارًا رسميًا

          Built from main @ __SHA__ for on-device testing before the next official release. The next official release will supersede this build normally.

          - Package ID: io.github.ahmedzakefit.noor (unchanged)
          - versionCode: unchanged — installs as an in-place update over the installed release, app data preserved
          - versionName: __VERSION__ (test label only; not committed anywhere)
          - Signing: same release certificate as official releases — verified in CI against the latest official APK before publishing
          - The in-app update check and the landing-page download link are unaffected (this is a pre-release; /releases/latest still points to the official release)

          بالعربية: نسخة اختبارية للتحقق على الهاتف قبل الإصدار الرسمي القادم. معرّف الحزمة ورمز الإصدار دون تغيير، والتوقيع هو مفتاح الإصدار الرسمي نفسه، لذا تُثبَّت كتحديث فوق النسخة الحالية مع الحفاظ على البيانات. فحص التحديث داخل التطبيق ورابط التنزيل في الصفحة الرئيسية لا يتأثران بهذه النسخة الأولية.

          Checksum: see the .sha256 asset next to the APK.
          NOTES
          sed -i "s/__SHA__/${GITHUB_SHA}/; s/__VERSION__/${TEST_VERSION}/" notes.md
          gh release create "test-${SHORT_SHA}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TEST BUILD ${TEST_VERSION} — phone testing only / للاختبار على الهاتف فقط (not official)" \
            --notes-file notes.md \
            test-out/*.apk test-out/*.sha256

      - name: Verify the direct download link actually works
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/test-${SHORT_SHA}/noor-al-sabeel-${TEST_VERSION}.apk"
          CODE="$(curl -sSL -o dl.apk -w '%{http_code}' "$URL")"
          [ "$CODE" = "200" ] || { echo "::error::download link answered HTTP $CODE"; exit 1; }
          MAGIC="$(head -c 4 dl.apk | od -An -tx1 | tr -d ' \n')"
          [ "$MAGIC" = "504b0304" ] || { echo "::error::downloaded file is not a ZIP/APK (magic: $MAGIC)"; exit 1; }
          SIZE="$(stat -c %s dl.apk)"
          [ "$SIZE" -gt 5000000 ] || { echo "::error::APK implausibly small: $SIZE bytes"; exit 1; }
          DOWNLOADED_SHA="$(sha256sum dl.apk | cut -d' ' -f1)"
          PUBLISHED_SHA="$(awk '{print tolower($1)}' "test-out/noor-al-sabeel-${TEST_VERSION}.apk.sha256")"
          [ "$DOWNLOADED_SHA" = "$PUBLISHED_SHA" ] || { echo "::error::downloaded APK does not match the published checksum"; exit 1; }
          echo "Direct link verified: $URL"
          echo "SHA-256: $DOWNLOADED_SHA ($SIZE bytes)"
